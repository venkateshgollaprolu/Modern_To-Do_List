<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- ==================== HEADER ==================== -->
        <header class="app-header">

            <div class="header-content">

                <p class="greeting">Good Afternoon 👋</p>

                <h1 class="date">
                    Monday, September 14
                </h1>

                <p class="subtitle">
                    Stay organized. Get things done.
                </p>

            </div>


            <!-- ==================== STATISTICS ==================== -->

            <section class="statistics" aria-label="Task statistics">

                <div class="stat-card">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>

                <div class="stat-card">
                    <span class="stat-number" id="activeTasks">0</span>
                    <span class="stat-label">Active</span>
                </div>

                <div class="stat-card">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">Done</span>
                </div>

            </section>

        </header>


        <!-- ==================== TASK SECTION ==================== -->

        <section class="task-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">Your productivity</p>

                    <h2>
                        My Tasks
                    </h2>
                </div>


                <!-- Search -->

                <div class="search-box">

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search tasks..."
                        aria-label="Search tasks"
                    >

                </div>

            </div>


            <!-- ==================== FILTERS ==================== -->

            <nav class="task-filters" aria-label="Task filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                    type="button">
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                    type="button">
                    Completed
                </button>

            </nav>


            <!-- ==================== TASK LIST ==================== -->

            <div
                class="task-list"
                id="taskList"
                aria-live="polite">

                <!-- Tasks will be generated by JavaScript -->

            </div>


            <!-- Empty State -->

            <div
                class="empty-state"
                id="emptyState"
                hidden>

                <div class="empty-icon">
                    ✓
                </div>

                <h3>No tasks found</h3>

                <p>
                    Add a task to start being productive.
                </p>

            </div>


            <!-- ==================== ADD TASK BUTTON ==================== -->

            <button
                class="add-task-btn"
                id="addTaskBtn"
                type="button">

                <span class="add-icon">+</span>

                <span>Add New Task</span>

            </button>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
